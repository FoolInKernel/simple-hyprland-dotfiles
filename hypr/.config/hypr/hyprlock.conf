general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
    brightness = 0.7
    contrast = 0.9
    vibrancy = 0.1
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    outer_color = rgb(ffffff)
    inner_color = rgb(000000)
    font_color = rgb(ffffff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    rounding = 10
    check_color = rgb(ffffff)
    fail_color = rgb(ff5555)
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(ffffff)
    font_size = 64
    font_family = Lexend
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(ffffff)
    font_size = 18
    font_family = Lexend
    position = 0, 35
    halign = center
    valign = center
}